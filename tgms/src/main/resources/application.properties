# ===============================
# TGMS Configuration (Sprint 1 + 2 + 3)
# ===============================

server.port=8081

# --- Microsoft SQL Server Connection ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TGMS_DB;encrypt=true;trustServerCertificate=true
spring.datasource.username=tgms_user
spring.datasource.password=TGMS@12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# --- Application Information ---
spring.application.name=TGMS