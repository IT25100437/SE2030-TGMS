<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGMS – Dashboard</title>
    <meta name="description" content="TGMS Dashboard — role-based management overview for Textile and Garment operations.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <script>window.ACTIVE_MODULE = 'dashboard';</script>
</head>
<body>

<!-- ================================================
     TOP BAR
     ================================================ -->
<header class="topbar" role="banner">
    <div class="topbar-brand">
        <button class="hamburger" id="sidebarToggle" aria-label="Toggle sidebar">
            <span></span><span></span><span></span>
        </button>
        <div class="topbar-logo" aria-hidden="true">TG</div>
        <div class="topbar-title">
            <span>TGMS</span>
            <span>Textile &amp; Garment Management</span>
        </div>
    </div>

    <div class="user-info">
        <div class="user-avatar" id="userAvatar" aria-hidden="true">U</div>
        <div class="user-details">
            <span class="user-name" id="userLabel">Loading...</span>
            <span class="user-role" id="userRoleLabel"></span>
        </div>
        <button class="logout-btn" onclick="logout()" aria-label="Log out">
            <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
            Log Out
        </button>
    </div>
</header>

<!-- ================================================
     LAYOUT
     ================================================ -->
<div class="layout">

    <!-- SIDEBAR (rendered by /js/layout.js, role-based) -->
    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Module navigation">
        <!-- Navigation is rendered by the shared /js/layout.js (role-based) -->
    </nav>

    <!-- SIDEBAR OVERLAY for mobile -->
    <div id="sidebarOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:299;"></div>

    <!-- MAIN CONTENT -->
    <main class="content" id="mainContent">
        <!-- Welcome Card -->
        <div class="welcome-card" id="welcomeCard">
            <div class="welcome-eyebrow">Dashboard</div>
            <h2>Welcome back, <span id="welcomeName">—</span></h2>
            <p class="welcome-sub" id="welcomeSub">Here's an overview of your management modules and system activity.</p>
            <div class="role-badge" id="welcomeRole"></div>
        </div>

        <!-- KPI Cards (real data, injected by dashboard.js) -->
        <section aria-label="Key figures">
            <div class="dashboard-kpi-grid" id="kpiGrid"></div>
        </section>

        <!-- Quick Actions -->
        <section class="card hidden" id="quickActionsCard" aria-label="Quick actions">
            <div class="section-header">
                <h3><i class="fas fa-bolt section-icon" aria-hidden="true"></i>Quick Actions</h3>
            </div>
            <div class="quick-actions" id="quickActions"></div>
        </section>

        <!-- Role-specific panels: recent activity, alerts, lists -->
        <div id="dashboardPanels"></div>

        <!-- Module Links -->
        <section class="card dashboard-section" aria-label="Your modules">
            <div class="section-header">
                <h3><i class="fas fa-th-large section-icon" aria-hidden="true"></i>Your Modules</h3>
            </div>
            <div id="moduleLinks" class="module-link-grid"></div>
        </section>

    </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/layout.js"></script>
<script>initLayout();</script>
<script src="/js/dashboard.js"></script>

</body>
</html>
