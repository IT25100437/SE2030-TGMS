<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGMS – Dashboard</title>
    <meta name="description" content="TGMS Dashboard — role-based management overview for Textile and Garment operations.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ================================================
     TOP BAR
     ================================================ -->
<header class="topbar" role="banner">
    <div class="topbar-brand">
        <button class="hamburger" id="sidebarToggle" aria-label="Toggle sidebar" style="display:flex; margin-right:4px;">
            <span></span><span></span><span></span>
        </button>
        <div class="topbar-logo" aria-hidden="true">TG</div>
        <div class="topbar-title">
            <span>TGMS</span>
            <span>Textile &amp; Garment Management</span>
        </div>
    </div>

    <div class="user-info">
        <div class="user-avatar" id="userAvatar" aria-hidden="true">U</div>
        <div class="user-details">
            <span class="user-name" id="userLabel">Loading...</span>
            <span class="user-role" id="userRoleLabel"></span>
        </div>
        <button class="logout-btn" onclick="logout()" aria-label="Log out">
            <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
            Log Out
        </button>
    </div>
</header>

<!-- ================================================
     LAYOUT
     ================================================ -->
<div class="layout">

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Module navigation">
        <div class="sidebar-section-label">Navigation</div>
        <a href="/dashboard.html" class="active" aria-current="page">
            <i class="fas fa-th-large" aria-hidden="true"></i>
            Dashboard
        </a>
        <!-- Role-based links injected by dashboard.js -->
    </nav>

    <!-- SIDEBAR OVERLAY for mobile -->
    <div id="sidebarOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:299;"
         onclick="closeSidebar()"></div>

    <!-- MAIN CONTENT -->
    <main class="content" id="mainContent">

        <!-- Welcome Card -->
        <div class="welcome-card" id="welcomeCard">
            <p style="font-size:12px; color:rgba(255,255,255,0.55); text-transform:uppercase; letter-spacing:1.5px; font-weight:600; margin-bottom:6px;">Dashboard</p>
            <h2>Welcome back, <span id="welcomeName">—</span></h2>
            <p style="font-size:14px; color:rgba(255,255,255,0.65); margin-top:4px;">Here's an overview of your management modules and system activity.</p>
            <div class="role-badge" id="welcomeRole"></div>
        </div>

        <!-- KPI Cards -->
        <div class="dashboard-kpi-grid" id="kpiGrid">
            <!-- Injected by dashboard.js -->
        </div>

        <!-- Module Links -->
        <div class="card">
            <div class="card-header">
                <h3>Your Modules</h3>
            </div>
            <div id="moduleLinks">
                <!-- Injected by dashboard.js -->
            </div>
        </div>

    </main>
</div>


<script src="/js/api.js"></script>
<script src="/js/dashboard.js"></script>
<script>
/* Sidebar toggle for mobile */
const sidebarToggle = document.getElementById('sidebarToggle');
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');

function openSidebar() {
    sidebar.classList.add('open');
    sidebarOverlay.style.display = 'block';
}
function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.style.display = 'none';
}

sidebarToggle.addEventListener('click', () => {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
});
</script>

</body>
</html>
